# Сборка PhoneAgent.exe на Windows-машине GitHub и релиз с ним.
#
# Запуск: вкладка Actions → «Сборка exe и релиз» → Run workflow (тег, заголовок,
# описание). adb, scrcpy и свой сервер Telegram Bot API берутся из прошлого
# релиза (`.github/scripts/tools_from_release.py`): на чистой машине их нет, а
# сервер Telegram собран из исходников и скачать его негде.
#
# Ошибки шагов и итоги проверок выводятся аннотациями (::error / ::notice):
# их видно в сводке запуска, не открывая длинный журнал.
name: Сборка exe и релиз

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег, например v2026.10.28.2"
        required: true
      title:
        description: "Заголовок релиза"
        required: true
      notes:
        description: "Описание релиза (Markdown)"
        required: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      TITLE: ${{ inputs.title }}
      NOTES: ${{ inputs.notes }}
    steps:
      - uses: actions/checkout@v4

      - name: Помощник для аннотаций
        run: |
          cat > "$RUNNER_TEMP/note.sh" <<'EOS'
          # step <заголовок> <команда...>: выполнить; упала — хвост вывода в ::error
          step() {
            local title="$1"; shift
            local log="$RUNNER_TEMP/step.log"
            local rc=0
            "$@" > "$log" 2>&1 || rc=$?        # || — чтобы bash -e не вышел раньше
            cat "$log"
            if [ $rc -ne 0 ]; then
              local tail; tail=$(tail -n 20 "$log" | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=${title}::код ${rc}%0A${tail}"
              exit $rc
            fi
          }
          EOS

      - name: Тег в порядке и ещё не занят
        run: |
          [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)+$ ]] || { echo "::error::тег «$TAG» не похож на v2026.10.28.2"; exit 1; }
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::релиз $TAG уже есть"; exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: PyInstaller
        run: |
          . "$RUNNER_TEMP/note.sh"
          step "pip install pyinstaller" python -m pip install --disable-pip-version-check pyinstaller
          echo "::notice title=PyInstaller::$(python -m PyInstaller --version), $(python --version)"

      - name: Инструменты из прошлого релиза
        run: |
          . "$RUNNER_TEMP/note.sh"
          mkdir -p "$RUNNER_TEMP/prev"
          step "скачать прошлый релиз" gh release download -R "$GITHUB_REPOSITORY" -p PhoneAgent.exe -D "$RUNNER_TEMP/prev"
          step "достать инструменты" python -I -X utf8 .github/scripts/tools_from_release.py "$RUNNER_TEMP/prev/PhoneAgent.exe" env/tools
          echo "::notice title=Инструменты::$(ls env/tools | tr '\n' ' ')"

      - name: Самотест
        run: |
          . "$RUNNER_TEMP/note.sh"
          # В копии: проверки не должны трогать файлы, которые уедут в exe.
          cp -r . "$RUNNER_TEMP/check"
          cd "$RUNNER_TEMP/check"
          step "selftest.py" python selftest.py

      - name: Сборка exe
        run: |
          . "$RUNNER_TEMP/note.sh"
          mkdir -p "$USERPROFILE/Desktop"
          step "build_exe.py" python build_exe.py
          echo "::notice title=Сборка::$(tail -n 1 "$RUNNER_TEMP/step.log")"

      - name: exe запускается и работает с вшитым adb
        shell: pwsh
        run: |
          $exe = "$env:USERPROFILE\Desktop\PhoneAgent.exe"
          foreach ($cmd in @("--help", "queue")) {
            $p = Start-Process $exe -ArgumentList $cmd -PassThru
            if (-not $p.WaitForExit(180000)) {
              $p.Kill(); Write-Output "::error title=exe::PhoneAgent.exe $cmd завис"; exit 1
            }
            if ($p.ExitCode -ne 0) {
              $log = (Get-Content "$env:LOCALAPPDATA\PhoneAgent\logs\app.log" -Tail 20 -ErrorAction SilentlyContinue) -join '%0A'
              Write-Output "::error title=exe::PhoneAgent.exe $cmd -> код $($p.ExitCode)%0A$log"; exit 1
            }
          }
          $tools = @(Get-ChildItem -Recurse "$env:LOCALAPPDATA\PhoneAgent\tools" -Filter *.exe | ForEach-Object Name)
          foreach ($need in @("adb.exe", "scrcpy.exe", "telegram-bot-api.exe")) {
            if ($tools -notcontains $need) { Write-Output "::error title=exe::в exe нет $need"; exit 1 }
          }
          $mb = "{0:N1}" -f ((Get-Item $exe).Length / 1MB)
          Write-Output "::notice title=exe::$mb МБ; --help и queue — код 0; распаковал: $($tools -join ', ')"

      - name: Все проверки без телефона (для сведения)
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP/check"
          export PATH="$GITHUB_WORKSPACE/env/tools/platform-tools:$PATH"
          rc=0
          python scratchpad/all_tests.py > "$RUNNER_TEMP/tests.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/tests.log"
          bad=$(sed -n '/^ИТОГ/,$p' "$RUNNER_TEMP/tests.log" | grep -c "СБОЙ" || true)
          good=$(sed -n '/^ИТОГ/,$p' "$RUNNER_TEMP/tests.log" | grep -c "\[ок \]" || true)
          list=$(sed -n '/^ИТОГ/,$p' "$RUNNER_TEMP/tests.log" | grep "СБОЙ" | sed 's/^ *//' | awk '{printf "%s%%0A", $0}' || true)
          echo "::notice title=Проверки на Windows::сошлось ${good}, сбоев ${bad}%0A${list}"
          exit $rc

      - name: Релиз
        run: |
          . "$RUNNER_TEMP/note.sh"
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          step "gh release create" gh release create "$TAG" "$USERPROFILE/Desktop/PhoneAgent.exe" -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md"
          echo "::notice title=Релиз::$TAG выложен"
